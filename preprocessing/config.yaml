# NILM Data Preprocessing Configuration

columns:
  timestamp: "host_time"
  rel_time: "t_s"
  seq: "seq"
  cycle: "cycle"
  active_power: "p_w"
  irms: "irms"
  vrms: "vrms"
  phase_deg: "phase_deg"
  harmonics_current: ["ih1", "ih2", "ih3", "ih4", "ih5", "ih6", "ih7", "ih8", "ih9", "ih10", "ih11", "ih12", "ih13", "ih14", "ih15"]

sorting:
  primary_key: "seq_cycle" # 'seq_cycle' or 'timestamp'
  deduplicate: true
  cycles_per_packet: 30
  sort_ascending: true

labeling:
  on_power_threshold: 5.0        # Power (W) above which appliance is considered ON
  off_power_threshold: 2.0       # Hysteresis lower threshold (W) for OFF state
  disconnected_power_threshold: 1.8 # Power (W) below which device is considered DISCONNECTED (-1)
  irms_threshold: 0.02           # RMS Current (A) minimum threshold for ON
  transient_window_cycles: 30    # Default duration of transient phase in cycles (approx 0.5s at 60Hz)
  use_dynamic_transient: true    # Adjust transient window based on power derivative stabilization
  min_delta_p_transient: 1.5     # Minimum dP/dt (W/cycle) to trigger dynamic transient start
  
  state_codes:
    DISCONNECTED: -1
    STEADY_OFF: 0
    ON_TRANSIENT: 1
    STEADY_ON: 2
    OFF_TRANSIENT: 3


features:
  smooth_window: 5
  calculate_deltas: true
  normalize_harmonics: true
  drop_voltage_harmonics: true          # Omit vh1 ~ vh15 (low accuracy and constant)
  apply_harmonic_decay_weight: true      # Apply 1/h decay weighting for higher order current harmonics
  harmonic_decay_exponent: 1.0           # Weight = 1 / (order ^ exponent)

voltage_interpolation:
  enabled: true                         # Up-sample 2Hz packet-level voltage to smooth 60Hz continuous wave
  method: "linear"                      # 'linear', 'cubic', or 'pchip'
  cols_to_interpolate: ["vrms", "thd_v", "freq_hz"]
  replace_original: true                # Overwrite 0.5s step values with smooth 60Hz interpolated curve

synthesis:
  total_cycles: 60000
  min_on_cycles: 300
  max_on_cycles: 3600
  min_off_cycles: 200
  max_off_cycles: 2400
  keep_standby_power: true              # Preserve appliance standby power (0.5W~3.5W) during OFF/standby periods
  seed: 42



