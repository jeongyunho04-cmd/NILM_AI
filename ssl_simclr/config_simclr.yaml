# 1D-SimCLR (Self-Supervised Contrastive Learning) Configuration for NILM AI

paths:
  dataset: "../preprocessing/output/synthetic_nilm_12h.csv"
  unet_checkpoint: "../best_unet_nilm.pth"
  scaler: "../scaler.pkl"
  output_dir: "./checkpoint_simclr"

simclr:
  window_len: 320             # 320 cycles (~5.33s at 60Hz)
  stride: 32                  # 32 cycles (~0.53s stride)
  feature_dim: 55             # Input feature channels (agg power, irms, vrms, phase, ih1~ih15, etc.)
  embedding_dim: 512          # Encoder representation dimension h
  projection_dim: 128         # Projection head output dimension z
  temperature: 0.07           # InfoNCE loss temperature tau

augmentations:
  voltage_jitter_pct: 0.03    # Voltage sag/swell +/-3% (220V +/- 6.6V)
  noise_snr_db: 30.0          # Additive Gaussian noise (SNR 30dB)
  phase_shift_deg: 3.0        # Micro phase shift +/-3 deg
  max_crop_pct: 0.15          # Max time crop percentage 15%
  harmonic_jitter_pct: 0.05   # Higher-order current harmonic jitter +/-5%

training:
  batch_size: 512             # Large batch size for robust contrastive negative pairs (RTX 5070 optimized)
  epochs: 50                  # Pre-training epochs (50 for fast mode, 100 for deep mode)
  learning_rate: 0.001        # Base learning rate (AdamW)
  weight_decay: 1.0e-4        # L2 Regularization
  use_amp: true               # PyTorch Automatic Mixed Precision FP16
  seed: 42

novelty_detection:
  distance_threshold: 0.45    # Cosine distance threshold for classifying an appliance as 'Unregistered/New'
  cluster_method: "umap"      # 'umap' or 'tsne' for 2D visualization
